<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GYA DECO · Gestión</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.3/dist/umd/supabase.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
:root{--bg:#141311;--card:#1f1d1a;--ink:#f1ece2;--mut:#a39c8e;--line:#35312b;--gold:#d2ad6a;--ok:#6cc48f;--bad:#e5786d;color-scheme:dark}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 "Helvetica Neue",Arial,sans-serif}
#app{display:flex;min-height:100vh}aside{width:210px;background:#0c0b0a;padding:18px 10px;flex:none}
aside h1{font:400 20px Georgia,serif;letter-spacing:.3em;color:var(--gold);text-align:center;margin:0 0 18px}
aside button{display:block;width:100%;text-align:left;background:none;border:0;color:var(--mut);padding:10px 12px;border-radius:8px;cursor:pointer;font:inherit}
aside button.on,aside button:hover{background:var(--card);color:var(--gold)}aside a{color:var(--mut);display:block;padding:10px 12px;text-decoration:none}
main{flex:1;padding:20px;min-width:0}h2{font:400 22px Georgia,serif;margin:0 0 14px}
h3{font:600 11px/1 inherit;letter-spacing:.15em;text-transform:uppercase;color:var(--gold);margin:18px 0 8px}
.g{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px}
.k{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px}.k span{display:block;color:var(--mut);font-size:12px}
.k b{font:400 20px Georgia,serif}.pos b{color:var(--ok)}.neg b{color:var(--bad)}
.box{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:12px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:end}.row>div{flex:1;min-width:130px}
label{display:block;color:var(--mut);font-size:12px;margin-bottom:3px}
input,select{width:100%;padding:8px;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:6px;font:inherit}
button.b{background:var(--gold);color:#1c1b19;border:0;border-radius:6px;padding:9px 14px;font-weight:600;cursor:pointer}button.s{background:none;color:var(--ink);border:1px solid var(--gold)}
.t{overflow-x:auto}table{width:100%;border-collapse:collapse}th,td{padding:7px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
th{color:var(--gold);font-size:11px;text-transform:uppercase;letter-spacing:.08em}td input{min-width:70px}td.r,th.r{text-align:right}
.tag{padding:2px 8px;border-radius:9px;font-size:11px;background:var(--line)}.tag.anulada{color:var(--bad)}.tag.pendiente{color:var(--gold)}.tag.cobrada{color:var(--ok)}
.m{color:var(--mut)}.err{color:var(--bad)}.al{border:1px solid var(--bad);color:var(--bad);border-radius:8px;padding:8px 12px;margin-bottom:10px}
#toast{position:fixed;bottom:16px;right:16px;background:var(--card);border:1px solid var(--gold);padding:10px 14px;border-radius:8px;display:none;max-width:80vw;z-index:9}
#login{max-width:340px;margin:12vh auto;padding:0 16px}#login h1{font:400 30px Georgia,serif;letter-spacing:.3em;color:var(--gold);text-align:center}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px;align-items:start}@media(max-width:900px){.g2{grid-template-columns:1fr}}
tr[data-i]{cursor:pointer}tr[data-i]:hover,tr.sel{background:#2a2620}
.ln{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px dashed var(--line)}.ln span:first-child{color:var(--mut)}
.tot{display:flex;justify-content:space-between;align-items:baseline;margin:10px 0;padding:12px 14px;border-radius:10px;background:#0c0b0a}.tot b{font:400 26px Georgia,serif;color:var(--gold)}
#kit .sk{min-width:120px}#kit .n{min-width:230px}#kit .cg{min-width:140px}#kit .pv{min-width:120px}#kit .nv{display:none;width:max-content;margin-top:3px}#kit .nv.on{display:block}
#kr th,#kr td{white-space:normal}#kr td.r{white-space:nowrap}#kr td:nth-child(2){min-width:120px}
@media print{aside,.np{display:none!important}body{background:#fff;color:#000}.k,.box{border-color:#ccc;background:#fff}th{color:#555}.k b{color:#000}}

/* ===== RESPONSIVE: celular, tablet y escritorio ===== */
html,body{overflow-x:hidden;-webkit-text-size-adjust:100%}
button{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.box{overflow-x:auto}main{max-width:1700px}
#mnu,#cur{display:none}
@media screen and (max-width:900px){
 #app{flex-direction:column}
 aside{width:auto;position:sticky;top:0;z-index:30;padding:8px 14px;padding-top:max(8px,env(safe-area-inset-top));border-bottom:1px solid var(--line)}
 #ah{display:flex;align-items:center;gap:10px}
 aside h1{margin:0;font-size:17px;text-align:left;flex:none;padding-left:0}
 #cur{display:block;flex:1;color:var(--mut);font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:right}
 #mnu{display:block;flex:none;width:auto;text-align:center;background:none;border:1px solid var(--line);color:var(--gold);border-radius:8px;padding:6px 12px;font-size:20px;line-height:1}
 #nv{display:none;margin-top:8px;max-height:calc(100vh - 70px);overflow-y:auto}
 #nv.open{display:block}
 #nv button{padding:13px 12px;font-size:15px;border-bottom:1px solid var(--line);border-radius:0}
 main{padding:14px 12px 28px;padding-left:max(12px,env(safe-area-inset-left));padding-right:max(12px,env(safe-area-inset-right))}
}
@media screen and (max-width:700px){
 body{font-size:15px}h2{font-size:20px}.box{padding:12px}
 .g{grid-template-columns:1fr 1fr;gap:8px}.k{padding:10px}.k b{font-size:17px}
 input,select{font-size:16px;padding:10px}
 button.b{min-height:44px;padding:11px 14px}
 .row{gap:8px}.row>div{min-width:calc(50% - 8px)}
 .row>div[style*="flex:none"]{flex:1 1 100%!important;min-width:100%;max-width:100%}.row>div[style*="flex:none"] button{width:100%;margin:0 0 6px}
 #toast{left:12px;right:12px;bottom:max(12px,env(safe-area-inset-bottom));max-width:none}
 #login{margin:8vh auto}
 #main table:not(.ft),#main table:not(.ft) tbody{display:block;width:100%}
 #main table:not(.ft) thead{display:none}
 #main table:not(.ft) tr{display:block;margin:0 0 10px;border:1px solid var(--line);border-radius:10px;padding:4px 12px;background:var(--bg)}
 #main table:not(.ft) td{display:block;border:0;border-bottom:1px dashed var(--line);padding:7px 0;text-align:right!important;white-space:normal!important}
 #main table:not(.ft) td:last-child{border-bottom:0}
 #main table:not(.ft) td::before{content:attr(data-l);float:left;margin-right:12px;color:var(--mut);font-size:12px;text-align:left}
 #main table:not(.ft) td::after{content:"";display:block;clear:both}
 #main table:not(.ft) td[colspan]{text-align:left!important}#main table:not(.ft) td[colspan]::before,#main table:not(.ft) td[data-l=""]::before{content:none}
 #main table:not(.ft) td button{margin:2px 0 2px 6px}
 .ft thead{display:none}.ft,.ft tbody{display:block;width:100%}
 .ft tr{display:grid;grid-template-columns:1fr 1fr;gap:8px;border:1px solid var(--line);border-radius:10px;padding:10px;margin-bottom:10px;background:var(--bg)}
 .ft td{display:block;border:0;padding:0;white-space:normal}
 .ft td::before{content:attr(data-l);display:block;font-size:11px;color:var(--mut);margin-bottom:2px}
 .ft td:nth-child(1),.ft td:nth-child(2),.ft td:last-child{grid-column:1/-1}
 .ft td:last-child::before{content:none}
 .ft td input,.ft td select{min-width:0!important;width:100%}
 .ft td .nv.on{display:inline-block;margin:0 0 4px}
}
</style></head><body>
<div id="app"></div><div id="toast"></div>
<script>
// ====== CONFIGURACIÓN: pegá acá los datos de tu proyecto Supabase (Settings > API) ======
const SUPABASE_URL = "https://hgwvurzdcvnjtryzehea.supabase.co";
const SUPABASE_KEY = "sb_publishable_pt6zduM9WY4bBwmqA2qqWQ_PWIlh1eL";
// =========================================================================================
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&","<":"<",">":">",'"':""","'":"'"}[c]));
const $m=v=>"$ "+Number(v||0).toLocaleString("es-AR",{minimumFractionDigits:2,maximumFractionDigits:2});
const nn=v=>Number(v||0).toLocaleString("es-AR",{maximumFractionDigits:2});
const iso=d=>d.toLocaleDateString("sv-SE"),hoy=()=>iso(new Date());
let sb,me,view="dash",st={per:"mes"},prods=[];
const rpc=async(f,a)=>{const{data,error}=await sb.rpc(f,a);if(error)throw error;return data};
const q=async p=>{const{data,error}=await p;if(error)throw error;return data};
const toast=(t,bad)=>{const e=$("#toast");e.textContent=t;e.style.borderColor=bad?"var(--bad)":"var(--gold)";e.style.display="block";clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.display="none",4500)};
let M4=true;
const BANNER='<div class="al"><b>Falta actualizar la base de datos.</b> Ejecutá <b>ACTUALIZAR_4_proveedores_stock.sql</b> en Supabase (SQL Editor). Hasta entonces no están disponibles: Compras y costos, movimientos de stock y medidas de producto. Lo demás funciona normal.</div>';
const sq=async b=>{const{data,error}=await b;return error?[]:data};
const stockVal=rows=>{const c=rows.filter(p=>+p.stock>0);return{productos_con_stock:c.length,unidades:c.reduce((a,p)=>a+ +p.stock,0),valor_costo:c.reduce((a,p)=>a+p.stock*p.costo,0),valor_venta:c.reduce((a,p)=>a+p.stock*p.precio_venta,0)}};
const friendly=m=>/productos_sku_uq/.test(m)?"Ya existe un producto con ese SKU":/proveedores_nombre_uq/.test(m)?"Ya existe un proveedor con ese nombre":/categorias_producto_uq/.test(m)?"Esa categoría ya existe":m;
const act=async(f,ok)=>{try{await f();toast(ok||"Listo");return true}catch(e){toast(friendly(e.message),1);return false}};
const csv=(n,head,rows)=>{const c=[head,...rows].map(r=>r.map(x=>'"'+String(x??"").replace(/"/g,'""')+'"').join(";")).join("\r\n");const a=document.createElement("a");a.href=URL.createObjectURL(new Blob(["\ufeff"+c],{type:"text/csv"}));a.download=n+".csv";a.click()};
const F=(l,id,v="",t="number")=>`<div><label>${l}</label><input id="${id}" type="${t}" step="any" value="${v}"></div>`,mm=d=>d?d.slice(5,7)+"/"+d.slice(0,4):"",pc=v=>nn(v)+" %";
const chart=(labs,ser,f=$m)=>{if(!labs.length)return'<div class="box m">Sin datos todavía</div>';const W=640,H=190,mx=Math.max(1,...ser.flatMap(s=>s.v.map(Math.abs))),bw=Math.min(W/labs.length,120),ox=(W-bw*labs.length)/2,w=bw*.8/ser.length;
  return `<div class="box"><svg viewBox="0 0 ${W} ${H+26}" style="width:100%;max-width:780px">${labs.map((l,i)=>ser.map((s,j)=>{const h=Math.abs(s.v[i])/mx*H;return `<rect x="${ox+i*bw+bw*.1+j*w}" y="${H-h}" width="${w-3}" height="${h}" rx="2" fill="${s.v[i]<0?"#e5786d":s.c}"><title>${s.n} ${l}: ${f(s.v[i])}</title></rect>`}).join("")+`<text x="${ox+i*bw+bw/2}" y="${H+17}" fill="#a39c8e" font-size="12" text-anchor="middle">${l}</text>`).join("")}</svg><div class="m">${ser.map(s=>`<span style="color:${s.c}">■</span> ${s.n}`).join("   ")}</div></div>`};
const K=(l,v,c)=>`<div class="k ${c||""}"><span>${l}</span><b>${v}</b></div>`;
const rango=(p,a,b)=>{const n=new Date(),y=n.getFullYear(),m=n.getMonth(),D=iso;
  return{hoy:[D(n),D(n)],7:[D(new Date(y,m,n.getDate()-6)),D(n)],30:[D(new Date(y,m,n.getDate()-29)),D(n)],mes:[D(new Date(y,m,1)),D(n)],
  ant:[D(new Date(y,m-1,1)),D(new Date(y,m,0))],anio:[D(new Date(y,0,1)),D(n)],custom:[a,b]}[p]};

async function boot(){
  if(SUPABASE_URL.startsWith("PEGAR")){$("#app").innerHTML='<div id="login"><h1>GYA DECO</h1><p class="err">Falta configurar Supabase: editá gestion.html y pegá la URL y la anon key arriba del script.</p></div>';return}
  sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
  const{data:{session}}=await sb.auth.getSession();
  session?start():login();
}
function login(){
  $("#app").innerHTML=`<div id="login"><h1>GYA DECO</h1><div class="box"><label>Email</label><input id="em" type="email"><label style="margin-top:8px">Contraseña</label><input id="pw" type="password"><p></p><button class="b" id="go" style="width:100%">Ingresar</button></div></div>`;
  const go=()=>act(async()=>{const{error}=await sb.auth.signInWithPassword({email:$("#em").value,password:$("#pw").value});if(error)throw error;start()},"Bienvenido");
  $("#go").onclick=go;$("#pw").onkeydown=e=>{if(e.key=="Enter")go()};
}
async function start(){
  const{data:{user}}=await sb.auth.getUser();
  M4=!(await sb.from("proveedores").select("id").limit(1)).error;
  const{data}=await sb.from("profiles").select("*").eq("id",user.id).maybeSingle();
  if(!data||!data.activo){$("#app").innerHTML='<div id="login"><h1>GYA DECO</h1><p class="err">Tu usuario todavía no tiene un perfil asignado.</p><button class="b s" onclick="salir()">Salir</button></div>';return}
  me=data;view=me.rol=="admin"?"dash":"inv";shell();draw();
}
const salir=async()=>{await sb.auth.signOut();login()};
const NAV=[["dash","Dashboard"],["pres","Presupuestos"],["venta","Registrar venta"],["hist","Inbox de ventas"],["cli","Clientes"],["prod","Productos"],["compras","Compras y costos"],["gasto","Gastos"],["inv","Inversores"],["caja","Caja y movimientos"],["rep","Reportes"]];
const mobilize=()=>$$("#main table").forEach(t=>{const h=[...t.querySelectorAll("thead th")].map(x=>x.textContent.trim());if(!h.length)return;t.querySelectorAll("tbody tr").forEach(tr=>[...tr.children].forEach((td,i)=>{if(td.dataset.l===undefined&&h[i]!==undefined)td.dataset.l=h[i]}))});
function shell(){
  const nv=me.rol=="admin"?NAV:NAV.filter(x=>x[0]=="inv");
  $("#app").innerHTML=`<aside><div id="ah"><h1>GYA DECO</h1><span id="cur"></span><button id="mnu" aria-label="Menú">☰</button></div><nav id="nv">${nv.map(x=>`<button data-v="${x[0]}">${x[1]}</button>`).join("")}<button id="out">Salir (${esc(me.nombre)})</button></nav></aside><main id="main"></main>`;
  $("aside").onclick=e=>{if(e.target.closest("#mnu")){$("#nv").classList.toggle("open");return}const b=e.target.closest("button[data-v]");if(b){view=b.dataset.v;$("#nv").classList.remove("open");scrollTo(0,0);draw()}};$("#out").onclick=salir;
  new MutationObserver(()=>requestAnimationFrame(mobilize)).observe($("#main"),{childList:true,subtree:true});
}
async function draw(){
  $$("aside button[data-v]").forEach(b=>b.classList.toggle("on",b.dataset.v==view));
  const nx=NAV.find(n=>n[0]==view);if($("#cur"))$("#cur").textContent=nx?nx[1]:"";
  $("#main").innerHTML='<p class="m">Cargando…</p>';
  try{await V[view]();if(!M4&&me.rol=="admin")$("#main").insertAdjacentHTML("afterbegin",BANNER)}catch(e){$("#main").innerHTML=`<p class="err">${esc(e.message)}</p>`}
}
const V={};

V.dash=async()=>{
  const[d,h]=rango(st.per,st.d,st.h),t=hoy(),m0=t.slice(0,8)+"01",P=(a,b)=>rpc("resumen_periodo",{p_desde:a,p_hasta:b});
  const[r,vh,vm,vt,caja,inv,du,cons,dif,vsk]=await Promise.all([P(d,h),P(t,t),P(m0,t),P("2000-01-01",t),rpc("caja_actual"),rpc("resumen_inversores"),rpc("resumen_dueno"),rpc("verificar_consistencia"),rpc("periodos_con_diferencias"),q(sb.from("productos").select("stock,costo,precio_venta"))]);
  const n0=new Date(),ms=[...Array(6)].map((_,k)=>{const t=new Date(n0.getFullYear(),n0.getMonth()-5+k,1);return[t.toLocaleDateString("es-AR",{month:"short"}),iso(t),iso(new Date(t.getFullYear(),t.getMonth()+1,0))]});
  const ev=(await Promise.all(ms.map(a=>P(a[1],a[2])))).map(a=>a[0]);
  const vs=stockVal(vsk),x=r[0],i=inv.reduce((a,v)=>({capital_aportado:a.capital_aportado+ +v.capital_aportado,ganancias_generadas:a.ganancias_generadas+ +v.ganancias_generadas+ +v.ajustes,reinvertido_acumulado:a.reinvertido_acumulado+ +v.reinvertido,retirado:a.retirado+ +v.retirado,saldo_disponible:a.saldo_disponible+ +v.pendiente}),{capital_aportado:0,ganancias_generadas:0,reinvertido_acumulado:0,retirado:0,saldo_disponible:0}),o=du[0],bad=cons.filter(c=>!c.ok);
  const opts=[["hoy","Hoy"],["7","Últimos 7 días"],["30","Últimos 30 días"],["mes","Mes actual"],["ant","Mes anterior"],["anio","Año actual"],["custom","Personalizado"]];
  $("#main").innerHTML=`<h2>Dashboard</h2>
  ${bad.map(c=>`<div class="al">Inconsistencia: ${esc(c.chequeo)} (${esc(c.detalle)})</div>`).join("")}
  ${dif.length?`<div class="al">Hay ${dif.length} período(s) del inversor sin liquidar o desactualizados. Revisá "Cuenta del inversor".</div>`:""}
  <div class="row"><div><label>Período</label><select id="per">${opts.map(o=>`<option value="${o[0]}" ${o[0]==st.per?"selected":""}>${o[1]}</option>`).join("")}</select></div>
  ${st.per=="custom"?`<div><label>Desde</label><input id="pd" type="date" value="${st.d||""}"></div><div><label>Hasta</label><input id="ph" type="date" value="${st.h||""}"></div><div><button class="b" id="ap">Aplicar</button></div>`:""}</div>
  <h3>Ventas</h3><div class="g">${K("Ventas de hoy",$m(vh[0].facturacion))}${K("Ventas del mes",$m(vm[0].facturacion))}${K("Ventas históricas",$m(vt[0].facturacion))}
  ${K("Operaciones",x.operaciones)}${K("Unidades vendidas",nn(x.unidades))}${K("Ticket promedio",$m(x.ticket_promedio))}${K("Pendiente de cobro",$m(x.pendiente_de_cobro))}</div>
  <h3>Resultados del período</h3><div class="g">${K("Facturación",$m(x.facturacion))}${K("Costo de mercadería vendida",$m(x.costo_mercaderia))}${K("Gastos operativos",$m(x.gastos_operativos))}
  ${K("Ganancia bruta",$m(x.ganancia_bruta))}${K("Ganancia neta",$m(x.ganancia_neta),x.ganancia_neta<0?"neg":"pos")}${K("Rentabilidad",nn(x.rentabilidad_pct)+" %")}</div>
  <h3>Evolución de los últimos 6 meses</h3>${chart(ms.map(a=>a[0]),[{n:"Ventas",c:"#d2ad6a",v:ev.map(e=>+e.facturacion)},{n:"Costos + gastos",c:"#8a8272",v:ev.map(e=>+e.costo_mercaderia+ +e.gastos_operativos)},{n:"Ganancia neta",c:"#6cc48f",v:ev.map(e=>+e.ganancia_neta)}])}
  <h3>Caja</h3><div class="g">${K("Dinero disponible en caja",$m(caja),caja<0?"neg":"")}</div>
  <h3>Inventario (stock en plata)</h3><div class="g">${K("Valor del stock a costo",$m(vs.valor_costo))}${K("Valor del stock a precio de venta",$m(vs.valor_venta))}${K("Ganancia potencial del stock",$m(vs.valor_venta-vs.valor_costo),"pos")}${K("Unidades en stock",nn(vs.unidades)+" · "+(vs.productos_con_stock||0)+" productos")}</div>
  <h3>Inversor</h3><div class="g">${K("Capital aportado",$m(i.capital_aportado))}${K("Ganancias generadas",$m(i.ganancias_generadas))}${K("Capital reinvertido",$m(i.reinvertido_acumulado))}${K("Retiros",$m(i.retirado))}${K("Saldo disponible",$m(i.saldo_disponible),i.saldo_disponible<0?"neg":"pos")}</div>
  <h3>Dueño</h3><div class="g">${K("Ganancia acumulada",$m(o.ganancias_acumuladas))}${K("Retiros",$m(o.retiros))}${K("Saldo",$m(o.saldo))}</div>
  <p class="m">Las ventas pendientes no cuentan como facturación ni caja hasta marcarlas cobradas. Ganancia contable ≠ dinero en caja.</p>`;
  $("#per").onchange=e=>{st.per=e.target.value;draw()};if($("#ap"))$("#ap").onclick=()=>{st.d=$("#pd").value;st.h=$("#ph").value;draw()};
};

const filaItem=()=>`<tr><td><input class="sku" list="skus" placeholder="SKU"></td><td><input class="desc"></td><td><input class="cant" type="number" step="any" value="1"></td><td><input class="pre" type="number" step="any"></td><td><input class="cos" type="number" step="any"></td><td class="r sub">-</td><td><button class="b s x">✕</button></td></tr>`;
V.venta=async()=>{
  let cls;[prods,cls]=await Promise.all([q(sb.from("productos").select("*").eq("activo",true).order("sku")),q(sb.from("clientes").select("id,nombre").eq("activo",true).order("nombre"))]);
  $("#main").innerHTML=`<h2>Registrar venta</h2><datalist id="cls">${cls.map(c=>`<option value="${esc(c.nombre)}">`).join("")}</datalist><datalist id="skus">${prods.map(p=>`<option value="${esc(p.sku)}">${esc(p.descripcion)}</option>`).join("")}</datalist>
  <div class="box"><div class="row"><div><label>Fecha</label><input id="vf" type="date" value="${hoy()}"></div><div><label>Cliente (si no existe, se crea)</label><input id="vc" list="cls" placeholder="Buscar o escribir nombre"></div><div><label>Medio de pago</label><input id="vm" placeholder="Efectivo, transferencia…"></div>
  <div><label>Estado</label><select id="ve"><option value="cobrada">Cobrada</option><option value="pendiente">Pendiente de cobro</option></select></div><div><label>Observaciones</label><input id="vo"></div></div></div>
  <div class="box t"><table class="ft"><thead><tr><th>SKU</th><th>Descripción</th><th>Cant.</th><th>Precio unit.</th><th>Costo unit.</th><th class="r">Total</th><th></th></tr></thead><tbody id="its">${filaItem()}</tbody></table>
  <p><button class="b s" id="add">+ Agregar producto</button></p>
  <p class="m">Elegí un SKU del catálogo para completar descripción, precio y costo (podés cambiar el precio). Si el SKU no existe, escribí descripción y costo.</p></div>
  <div class="g" id="tt"></div><p><button class="b" id="ok">Confirmar venta</button></p>`;
  const calc=()=>{let T=0,C=0,U=0;$$("#its tr").forEach(tr=>{const g=c=>+tr.querySelector(c).value||0,s=g(".cant")*g(".pre");T+=s;C+=g(".cant")*g(".cos");U+=g(".cant");tr.querySelector(".sub").textContent=$m(s)});
    $("#tt").innerHTML=K("Unidades",nn(U))+K("Total vendido",$m(T))+K("Costo de mercadería",$m(C))+K("Ganancia bruta",$m(T-C),"pos")+K("Margen",T?nn((T-C)/T*100)+" %":"-")};
  $("#its").oninput=e=>{const tr=e.target.closest("tr");if(e.target.classList.contains("sku")){const p=prods.find(p=>p.sku.toUpperCase()==e.target.value.trim().toUpperCase());
    if(p){tr.querySelector(".desc").value=p.descripcion;tr.querySelector(".pre").value=p.precio_venta;tr.querySelector(".cos").value=p.costo}}calc()};
  $("#its").onclick=e=>{if(e.target.classList.contains("x")&&$$("#its tr").length>1){e.target.closest("tr").remove();calc()}};
  $("#add").onclick=()=>$("#its").insertAdjacentHTML("beforeend",filaItem());calc();
  $("#ok").onclick=async()=>{const items=$$("#its tr").map(tr=>{const g=c=>tr.querySelector(c).value.trim(),o={sku:g(".sku"),cantidad:+g(".cant")};
    if(g(".desc"))o.descripcion=g(".desc");if(g(".pre")!=="")o.precio_unitario=+g(".pre");if(g(".cos")!=="")o.costo_unitario=+g(".cos");return o});
    if(!confirm("¿Confirmar la venta?"))return;
    if(await act(async()=>{const nm=$("#vc").value.trim();let cid=null;
      if(nm){const ex=cls.find(c=>c.nombre.toLowerCase()==nm.toLowerCase());cid=ex?ex.id:(await q(sb.from("clientes").insert({nombre:nm}).select("id").single())).id}
      await rpc("crear_venta",{p_fecha:$("#vf").value,p_items:items,p_medio:$("#vm").value||null,p_estado:$("#ve").value,p_obs:$("#vo").value||null,p_cliente:cid})},"Venta registrada"))V.venta()};
};

async function prodFicha(p,cats){
  const[mv,ci,vi,au]=await Promise.all([sq(sb.from("movimientos_stock").select("*").eq("producto_id",p.id).order("seq",{ascending:false}).limit(300)),sq(sb.from("compra_items").select("*,compras(numero,fecha,proveedor,estado)").eq("producto_id",p.id)),sq(sb.from("venta_items").select("*,ventas(numero,fecha,estado,cliente_nombre)").eq("producto_id",p.id)),sq(sb.from("auditoria").select("*").eq("tabla","productos").eq("registro_id",p.id).order("at",{ascending:false}).limit(150))]);
  const TM={inicial:"Stock inicial",compra:"Compra",venta:"Venta",reintegro_venta:"Reintegro por venta",anulacion_compra:"Anulación de compra",ajuste:"Ajuste manual"},KS=[["sku","SKU"],["descripcion","Descripción"],["categoria","Categoría"],["precio_venta","Precio de venta"],["costo","Costo"],["activo","Activo"],["ancho_cm","Ancho"],["alto_cm","Alto"],["notas","Notas"]],fv=(k,v)=>v==null||v===""?"(vacío)":["precio_venta","costo"].includes(k)?$m(v):String(v);
  const cambios=au.flatMap(a=>{const d=new Date(a.at).toLocaleString("es-AR");if(a.accion=="INSERT")return[[d,"Alta del producto"]];if(a.accion!="UPDATE")return[];const t=KS.filter(([k])=>String(a.antes?.[k]??"")!=String(a.despues?.[k]??"")).map(([k,n])=>`${n}: ${fv(k,a.antes?.[k])} → ${fv(k,a.despues?.[k])}`);return t.length?[[d,t.join(" · ")]]:[]});
  $("#main").innerHTML=`<p><button class="b s" id="pb">← Todos los productos</button></p><h2>${esc(p.sku)} — ${esc(p.descripcion)} ${p.activo?"":'<span class="tag anulada">inactivo</span>'}</h2>
  <div class="g">${K("Stock actual",p.stock==null?"sin control":nn(p.stock))}${K("Valor del stock a costo",$m(p.stock>0?p.stock*p.costo:0))}${K("Valor del stock a precio de venta",$m(p.stock>0?p.stock*p.precio_venta:0))}${K("Costo",$m(p.costo))}${K("Precio de venta",$m(p.precio_venta))}<div class="k"><span>Margen s/costo · s/precio</span><b id="mg">-</b></div></div>
  <h3>Datos del producto (todo editable)</h3><div class="box"><div class="row"><div><label>SKU</label><input id="es" value="${esc(p.sku)}"></div><div style="flex:2"><label>Descripción</label><input id="ed" value="${esc(p.descripcion)}"></div><div><label>Categoría</label>${catSel(cats,"ec",p.categoria)}</div></div>
  <div class="row">${F("Precio de venta ($)","ep",p.precio_venta)}${F("Costo ($)","ek",p.costo)}${F("Ancho (cm)","ea",p.ancho_cm??"")}${F("Alto (cm)","eh",p.alto_cm??"")}<div style="flex:2"><label>Notas</label><input id="en2" value="${esc(p.notas)}"></div></div>

  <h3>Ajustar stock</h3><div class="box row">${F("Stock real contado","ek2",p.stock??0)}<div style="flex:2"><label>Motivo del ajuste *</label><input id="em" placeholder="Ej: conteo físico, rotura, regalo"></div><div style="flex:none"><button class="b" id="ea2">Ajustar stock</button></div></div>
  <h3>Movimientos de stock</h3><div class="box t"><table><thead><tr><th>Fecha</th><th>Tipo</th><th>Motivo</th><th class="r">Cantidad</th><th class="r">Stock anterior</th><th class="r">Stock posterior</th></tr></thead><tbody>${mv.map(m=>`<tr><td>${new Date(m.fecha).toLocaleString("es-AR")}</td><td>${TM[m.tipo]||m.tipo}</td><td style="white-space:normal">${esc(m.motivo)}</td><td class="r" style="color:var(--${m.cantidad<0?"bad":"ok"})">${m.cantidad>0?"+":""}${nn(m.cantidad)}</td><td class="r">${m.stock_anterior==null?"-":nn(m.stock_anterior)}</td><td class="r">${m.stock_posterior==null?"-":nn(m.stock_posterior)}</td></tr>`).join("")||'<tr><td colspan="6" class="m">Sin movimientos todavía</td></tr>'}</tbody></table></div>

  catBind("ec",cats);const mgn=()=>{const c=+$("#ek").value||0,pr=+$("#ep").value||0;$("#mg").textContent=c>0&&pr>0?nn((pr-c)/c*100)+" % · "+nn((pr-c)/pr*100)+" %":"-"};$("#ep").oninput=$("#ek").oninput=mgn;mgn();

}

function decForm(host,x,p){
  host.innerHTML=`<div class="box"><h3 style="margin-top:0">Decidir ganancia ${mm(p.periodo)} · ${esc(x.nombre)} · pendiente ${$m(p.pendiente)}</h3><div class="row">${F("Retira ($)","dr",0)}${F("Reinvierte ($)","di",p.pendiente)}${F("Fecha","df",hoy(),"date")}<div><label>Medio de pago del retiro</label><input id="dm"></div><div><label>Observaciones</label><input id="do"></div></div>
  <p><button class="b s" id="d1">Retirar todo</button> <button class="b s" id="d2">Reinvertir todo</button> <button class="b" id="d3">Registrar decisión</button> <span class="m" id="dc"></span></p></div>`;
  const chk=()=>{const t=(+$("#dr").value||0)+(+$("#di").value||0);$("#dc").textContent=Math.abs(t-p.pendiente)<.005?"✓ coincide con la ganancia liquidada":"Suma "+$m(t)+" · debe ser exactamente "+$m(p.pendiente)};
  $("#dr").oninput=$("#di").oninput=chk;chk();
  $("#d1").onclick=()=>{$("#dr").value=p.pendiente;$("#di").value=0;chk()};$("#d2").onclick=()=>{$("#dr").value=0;$("#di").value=p.pendiente;chk()};
  $("#d3").onclick=async()=>{if(await act(()=>rpc("registrar_decision_ganancia",{p_acuerdo:x.acuerdo_id,p_periodo:p.periodo,p_retira:+$("#dr").value||0,p_reinvierte:+$("#di").value||0,p_fecha:$("#df").value,p_medio:$("#dm").value||null,p_obs:$("#do").value||null}),"Decisión registrada"))draw()};
  host.scrollIntoView({behavior:"smooth"});
}

async function ficha(rs,adm){
  const x=rs.find(r=>r.acuerdo_id==st.iid),id=x.acuerdo_id;
  const[his,pend,pcts,aps]=await Promise.all([rpc("historial_inversor",{p_acuerdo:id}),rpc("pendientes_decision"),q(sb.from("porcentajes_inversor").select("*").eq("acuerdo_id",id).order("seq")),q(sb.from("aportes_inversor").select("*").eq("acuerdo_id",id).order("fecha"))]);
  const mine=pend.filter(p=>p.acuerdo_id==id),S=a=>a.reduce((t,v)=>t+ +v,0),ini=S(aps.filter(a=>a.tipo=="inicial").map(a=>a.importe)),adi=S(aps.filter(a=>a.tipo!="inicial").map(a=>a.importe)),gen=+x.ganancias_generadas+ +x.ajustes,pdec=S(mine.filter(p=>p.pendiente>0).map(p=>p.pendiente)),otros=rs.filter(r=>r.acuerdo_id!=id&&r.activo).reduce((a,r)=>a+ +r.porcentaje,0);
  const byM=(rows,f)=>{const m={};rows.forEach(r=>{const k=f(r);if(k)m[k]=(m[k]||0)+Math.abs(+r.importe)});return m};
  const gm={};his.filter(h=>["Ganancia generada","Ajuste"].includes(h.tipo)&&h.periodo).forEach(h=>{const k=h.periodo.slice(0,7);gm[k]=(gm[k]||0)+ +h.importe});
  const ret=byM(his.filter(h=>h.tipo=="Retiro de ganancias"),h=>h.fecha.slice(0,7)),rei=byM(his.filter(h=>h.tipo=="Reinversión"),h=>h.fecha.slice(0,7)),apm=byM(aps.map(a=>({importe:a.importe,fecha:a.fecha})),a=>a.fecha.slice(0,7));
  const M1=Object.keys(gm).sort(),M2=[...new Set([...Object.keys(ret),...Object.keys(rei),...Object.keys(apm)])].sort();let ca=0,cr=0;
  const cum=M2.map(k=>{ca+=apm[k]||0;cr+=rei[k]||0;return[ca,cr]}),lab=k=>mm(k+"-01");
  $("#main").innerHTML=`${adm?'<p><button class="b s" id="vb">← Todos los inversores</button></p>':""}<h2>${esc(x.nombre)} ${x.activo?"":'<span class="tag anulada">inactivo</span>'}</h2>
  <p class="m">Participación actual <b>${pc(x.porcentaje)}</b> de la ganancia neta distribuible · incorporado ${x.fecha_incorporacion}${x.notas?" · "+esc(x.notas):""}</p>
  <div class="g">${K("Capital inicial aportado",$m(ini))}${K("Aportes adicionales",$m(adi))}${K("Total capital aportado",$m(x.capital_aportado))}${K("Ganancias históricas generadas",$m(gen))}${K("Ganancias pendientes de decisión",$m(pdec))}${K("Ganancias retiradas",$m(x.retirado))}${K("Ganancias reinvertidas",$m(x.reinvertido))}${K("Capital reinvertido acumulado",$m(x.reinvertido))}${K("Saldo pendiente de retiro",$m(x.pendiente),x.pendiente<0?"neg":"pos")}${K("Generó para sí mismo (retirado)",$m(x.retirado))}${K("Dejó reinvertido en GYA DECO",$m(x.reinvertido)+(gen>0?" · "+pc(x.reinvertido/gen*100):""))}</div>
  <h3>Ganancias mensuales</h3>${chart(M1.map(lab),[{n:"Ganancia",c:"#d2ad6a",v:M1.map(k=>gm[k])}])}

  ${adm?`<h3>Ganancias pendientes de decisión</h3><div class="box t"><table><thead><tr><th>Período</th><th class="r">Pendiente</th><th></th></tr></thead><tbody>${mine.map((p,k)=>`<tr><td>${mm(p.periodo)}</td><td class="r">${$m(p.pendiente)}</td><td>${p.pendiente>0?`<button class="b s" data-dd="${k}">Decidir (retirar / reinvertir / parcial)</button>`:'<span class="m">saldo a compensar con ganancias futuras</span>'}</td></tr>`).join("")||'<tr><td colspan="3" class="m">Sin ganancias pendientes</td></tr>'}</tbody></table></div><div id="dec"></div>

const pad=n=>String(n).padStart(5,"0"),GOLD=[176,141,74],DARK=[28,27,25],GR=[110,105,96],r2=v=>Math.round(v*100)/100;

function calcP(){const g=i=>+($("#"+i).value)||0,w=g("pw"),h=g("ph"),ar=w*h/1e4,m2=g("pm"),mer=g("pmer"),pl=ar>0?Math.ceil(m2*(1+mer/100)/ar-1e-9):0,cost=g("pco"),mk=g("pmk"),pvu=byPrice?g("pvp"):cost*(1+mk/100),sub=pl*pvu,d=Math.min(100,g("pd")),dm=sub*d/100,gr=m2>10,env=gr?0:g("pen"),neto=sub-dm;
  return{w,h,ar,m2,mer,placas:pl,cost,mk,pvu,sub,d,dm,gr,env,neto,total:neto+env,gan:neto-pl*cost,val:g("pv")||7,cubre:pl*ar,rec:cost>0?(pvu/cost-1)*100:0,mg:pvu>0?(pvu-cost)/pvu*100:0}}
const rowP=r=>{const ar=r.ancho_cm*r.alto_cm/1e4;return{numero:r.numero,fecha:r.fecha,cliente:r.cliente_nombre,tel:r.telefono,dir:r.direccion,w:+r.ancho_cm,h:+r.alto_cm,ar,m2:+r.m2,mer:+r.merma_pct,placas:r.placas,pvu:+r.precio_unitario,sub:+r.subtotal,d:+r.descuento_pct,dm:+r.descuento_monto,env:+r.envio,gr:+r.m2>10,neto:r.subtotal-r.descuento_monto,total:+r.total,val:r.validez_dias,cubre:r.placas*ar,pdesc:r.producto_desc}};

//CALC_COMPRA_START
const sc=(v,d)=>{v=String(v??"").trim().replace(",",".");if(v===""||isNaN(+v))return 0n;const neg=v[0]=="-";if(neg)v=v.slice(1);let[i,f=""]=v.split(".");f=(f+"0".repeat(d+1)).slice(0,d+1);let x=BigInt(i||"0")*10n**BigInt(d)+BigInt(f.slice(0,d)||"0");if(+f[d]>=5)x+=1n;return neg?-x:x};
const ds=(x,d)=>{const n=x<0n,a=(n?-x:x).toString().padStart(d+1,"0");return(n?"-":"")+(d?a.slice(0,-d)+"."+a.slice(-d):a)};
const rdiv=(a,b)=>(2n*a+b)/(2n*b);
function calcCompra(i){
  const dg=sc(i.dg,3),ap=sc(i.ap,3),env=sc(i.envio,2),otr=sc(i.otros,2);
  const L=i.items.map((x,k)=>{const q=sc(x.q,3),pr=sc(x.pr,2),di=sc(x.di,3);return{k,sku:x.sku,nombre:x.nombre,q,pr,di,bruto:rdiv(q*pr,1000n),neto:rdiv(q*pr*(100000n-di)*(100000n-dg),10n**13n)}});
  const sub=L.reduce((a,l)=>a+l.bruto,0n),merch=L.reduce((a,l)=>a+l.neto,0n);
  if(!L.length||merch<=0n)return null;
  const base=i.base=="mercaderia"?merch:i.base=="mercaderia_envio_otros"?merch+env+otr:merch+env;
  const adic=rdiv(base*ap,100000n),calc=merch+env+adic+otr,pg=sc(i.pagado,2),pay=pg>0n?pg:calc;
  if(pay<=0n)return null;
  let tot=0n;L.forEach(l=>{const n=pay*l.neto;l.f=n/merch;l.r=n%merch;tot+=l.f});
  let R=pay-tot;[...L].sort((a,b)=>a.r>b.r?-1:a.r<b.r?1:a.k-b.k).forEach(l=>{if(R>0n){l.alloc=l.f+1n;R-=1n}else l.alloc=l.f});
  const N=c=>Number(c)/100;
  return{sub:N(sub),merch:N(merch),env:N(env),base:N(base),adic:N(adic),otr:N(otr),calc:N(calc),pay:N(pay),dif:N(pay-calc),factor:Number(pay)/Number(merch),pay_c:pay.toString(),merch_c:merch.toString(),
   lines:L.map(l=>{const q=Number(l.q)/1000;return{sku:l.sku,nombre:l.nombre,q,pr:Number(l.pr)/100,di:Number(l.di)/1000,bruto:N(l.bruto),neto:N(l.neto),pdu:N(l.neto)/q,part:Number(l.neto)/Number(merch),alloc:N(l.alloc),gasto:N(l.alloc-l.neto),cu:N(l.alloc)/q,alloc_c:l.alloc.toString(),neto_c:l.neto.toString()}})}}
//CALC_COMPRA_END

    const cc=id=>{const p=provs.find(x=>x.id==id),lst=cs.filter(c=>c.proveedor_id==id);$("#vcc").innerHTML=`<h3>Cuenta corriente · ${esc(p.nombre)}</h3><div class="box t"><table><thead><tr><th>Compra</th><th>Fecha</th><th>Comprobante</th><th class="r">Total</th><th class="r">Pagado</th><th class="r">Saldo</th><th>Estado</th><th></th></tr></thead><tbody>${lst.map(c=>{const s=PS(c);return`<tr><td>#${c.numero}</td><td>${c.fecha}</td><td>${esc(c.comprobante)}</td><td class="r">${$m(c.total_pagado)}</td><td class="r">${$m(s.pg)}</td><td class="r">${$m(s.sal)}</td><td><span class="tag ${tg(s.est)}">${s.est}</span></td><td>${s.sal>0&&c.estado=="confirmada"?`<button class="b s" data-pay="${c.id}">Registrar pago</button>`:""}</td></tr>`}).join("")||'<tr><td colspan="8" class="m">Sin compras</td></tr>'}</tbody></table></div>`;
      $$("[data-pay]").forEach(b=>b.onclick=()=>payForm($("#pfh"),cs.find(c=>c.id==b.dataset.pay)));$("#vcc").scrollIntoView({behavior:"smooth"})};
    $$("[data-vcc]").forEach(b=>b.onclick=()=>cc(b.dataset.vcc));
  }

  function tHist(){
    $("#ctv").innerHTML=`<div class="box t"><table><thead><tr><th>N°</th><th>Fecha</th><th>Proveedor</th><th>Comprobante</th><th class="r">Total</th><th class="r">Pagado</th><th class="r">Saldo</th><th>Pago</th><th>Estado</th><th></th></tr></thead><tbody>${cs.map(c=>{const s=PS(c);return`<tr><td>#${c.numero}</td><td>${c.fecha}</td><td>${esc(c.proveedor)}</td><td>${esc(c.comprobante)}</td><td class="r">${$m(c.total_pagado)}</td><td class="r">${$m(s.pg)}</td><td class="r">${$m(s.sal)}</td><td><span class="tag ${tg(s.est)}">${s.est}</span></td><td>${c.estado}</td><td><button class="b s" data-k="${c.id}">Ver</button></td></tr>`}).join("")||'<tr><td colspan="10" class="m">Todavía no hay compras</td></tr>'}</tbody></table></div><div id="kdt"></div><div id="pfh"></div>
    <h3>Historial de costos por artículo</h3><div class="box"><div class="row"><div><label>SKU o producto</label><input id="hs" list="skp2" placeholder="Elegí un SKU"><datalist id="skp2">${prods.map(p=>`<option value="${esc(p.sku)}">${esc(p.descripcion)}</option>`).join("")}</datalist></div></div></div><div id="hc"></div>`;
    const det=c=>{const li=its.filter(i=>i.compra_id==c.id).sort((a,b)=>a.linea-b.linea),mp=pgs.filter(p=>p.compra_id==c.id),s=PS(c);
      $("#kdt").innerHTML=`<div class="box"><h3 style="margin-top:0">Compra #${c.numero} · ${esc(c.proveedor)} · ${c.fecha}</h3><p class="m">Descuento general ${nn(c.descuento_general_pct)} % · envío ${$m(c.envio)} · adicional ${nn(c.adicional_pct)} % (${$m(c.adicional_monto)}) · otros ${$m(c.otros_gastos)} · factor ${(+c.factor).toFixed(6)} · total <b>${$m(c.total_pagado)}</b> · pagado ${$m(s.pg)} · <b>saldo ${$m(s.sal)}</b>${c.anulada_motivo?` · <span class="err">anulada: ${esc(c.anulada_motivo)}</span>`:""}</p>
      <div class="t"><table><thead><tr><th>SKU</th><th>Artículo</th><th class="r">Cant.</th><th class="r">Ingresó a stock</th><th class="r">Precio orig.</th><th class="r">Desc.</th><th class="r">Gastos asig.</th><th class="r">Costo unit. final</th><th class="r">Costo total</th><th class="r">Costo anterior</th></tr></thead><tbody>${li.map(i=>`<tr><td>${esc(i.sku)}</td><td>${esc(i.nombre)}</td><td class="r">${nn(i.cantidad)}</td><td class="r">${nn(i.ingreso_stock)}</td><td class="r">${$m(i.precio_unitario)}</td><td class="r">${nn(i.descuento_pct)} %</td><td class="r">${$m(i.gastos_asignados)}</td><td class="r" style="color:var(--gold);font-weight:700">${$m(i.costo_unitario)}</td><td class="r">${$m(i.costo_total)}</td><td class="r">${i.costo_anterior==null?"nuevo":$m(i.costo_anterior)}</td></tr>`).join("")}</tbody></table></div>
      <h3>Pagos</h3><div class="t"><table><thead><tr><th>Fecha</th><th class="r">Importe</th><th>Medio</th><th>Observaciones</th><th>Estado</th><th></th></tr></thead><tbody>${mp.map(p=>`<tr><td>${p.fecha}</td><td class="r">${$m(p.importe)}</td><td>${esc(p.medio_pago)}</td><td>${esc(p.observaciones)}</td><td>${p.anulado?'<span class="tag anulada">anulado</span>':""}</td><td>${p.anulado||c.estado!="confirmada"?"":`<button class="b s" data-ap="${p.id}">Anular pago</button>`}</td></tr>`).join("")||'<tr><td colspan="6" class="m">Sin pagos registrados</td></tr>'}</tbody></table></div>
      ${c.estado=="confirmada"?`<p>${s.sal>0?'<button class="b" id="kpg">Registrar pago</button> ':""}<button class="b s" id="kan">Anular compra</button></p><div class="row">${F("Recargo sobre costo (%)","kr2",50)}<div style="flex:none"><button class="b s" id="kap">Aplicar como precio de venta a estos SKU</button></div></div><p class="m">Precio de venta = costo unitario × (1 + recargo). Cambia el precio del catálogo; el historial de costos no se modifica.</p>`:""}</div>`;
      if($("#kpg"))$("#kpg").onclick=()=>payForm($("#pfh"),c);
      $$("[data-ap]").forEach(b=>b.onclick=async()=>{const m=prompt("Motivo de la anulación del pago:");if(m&&await act(()=>rpc("anular_pago_proveedor",{p_pago:b.dataset.ap,p_motivo:m}),"Pago anulado"))draw()});
      if($("#kap"))$("#kap").onclick=async()=>{const r=sc($("#kr2").value,3);if(!confirm("¿Actualizar el precio de venta de estos productos con un recargo de "+nn(Number(r)/1000)+" %?"))return;
        await act(()=>Promise.all(li.filter(i=>i.producto_id).map(i=>q(sb.from("productos").update({precio_venta:Number(rdiv(sc(i.costo_unitario,4)*(100000n+r),10n**7n))/100}).eq("id",i.producto_id)))),"Precios de venta actualizados")};
      if($("#kan"))$("#kan").onclick=async()=>{const m=prompt("Motivo de la anulación (se revierten costo, stock, pagos y caja):");if(m&&await act(()=>rpc("anular_compra",{p_compra:c.id,p_motivo:m}),"Compra anulada"))draw()}};
    $$("[data-k]").forEach(b=>b.onclick=()=>{det(cs.find(c=>c.id==b.dataset.k));$("#kdt").scrollIntoView({behavior:"smooth"})});
    $("#hs").oninput=e=>{const v=e.target.value.trim().toLowerCase();if(!v){$("#hc").innerHTML="";return}
      const h=its.filter(i=>i.compras?.estado=="confirmada"&&(i.sku.toLowerCase()==v||i.nombre.toLowerCase().includes(v))).sort((a,b)=>(b.compras.fecha+b.compras.numero).localeCompare(a.compras.fecha+a.compras.numero)),tc=h.reduce((a,i)=>a+ +i.costo_total,0),tq=h.reduce((a,i)=>a+ +i.cantidad,0);
      $("#hc").innerHTML=h.length?`<div class="g">${K("Último costo",$m(h[0].costo_unitario))}${K("Costo promedio ponderado",$m(tc/tq))}${K("Compras registradas",h.length)}</div><div class="box t"><table><thead><tr><th>Fecha</th><th>Compra</th><th>Proveedor</th><th class="r">Cantidad</th><th class="r">Costo unit. final</th></tr></thead><tbody>${h.map(i=>`<tr><td>${i.compras.fecha}</td><td>#${i.compras.numero}</td><td>${esc(i.compras.proveedor)}</td><td class="r">${nn(i.cantidad)}</td><td class="r">${$m(i.costo_unitario)}</td></tr>`).join("")}</tbody></table></div>`:'<div class="box m">Sin compras para ese artículo</div>'};
  }
  ({nueva:tNueva,prov:tProv,hist:tHist})[tab]();
};

V.caja=async()=>{
  const[c,rows,du]=await Promise.all([rpc("caja_actual"),q(sb.from("movimientos_caja").select("*").order("created_at",{ascending:false}).limit(300)),rpc("resumen_dueno")]);
  const T={venta:"Venta",ajuste_venta:"Ajuste de venta",anulacion_venta:"Anulación de venta",gasto:"Gasto",anulacion_gasto:"Anulación de gasto",aporte_capital:"Aporte de capital",retiro_inversor:"Retiro del inversor",retiro_dueno:"Retiro del dueño",otro_ingreso:"Otro ingreso",otro_egreso:"Otro egreso"};
  $("#main").innerHTML=`<h2>Caja y movimientos</h2><div class="g">${K("Dinero disponible en caja",$m(c),c<0?"neg":"pos")}${K("Ganancia acumulada del dueño",$m(du[0].ganancias_acumuladas))}${K("Retiros del dueño",$m(du[0].retiros))}${K("Saldo del dueño",$m(du[0].saldo))}</div>
  <p class="m">La caja es el dinero real que entró y salió. No es lo mismo que la ganancia contable. Las reinversiones del inversor no mueven la caja.</p>
  <h3>Registrar movimiento</h3><div class="box row"><div><label>Tipo</label><select id="ct"><option value="retiro_dueno">Retiro del dueño</option><option value="aporte_capital">Aporte de capital</option><option value="otro_ingreso">Otro ingreso</option><option value="otro_egreso">Otro egreso</option></select></div>
  <div><label>Importe</label><input id="ci" type="number" step="any"></div><div><label>Concepto</label><input id="cc"></div><div><label>Fecha</label><input id="cf" type="date" value="${hoy()}"></div><div><button class="b" id="cg">Registrar</button></div></div>
  <div class="box t"><table><thead><tr><th>Fecha</th><th>Tipo</th><th>Concepto</th><th class="r">Importe</th><th>Medio</th></tr></thead><tbody>${rows.map(m=>`<tr><td>${m.fecha}</td><td>${T[m.tipo]||m.tipo}</td><td>${esc(m.concepto)}</td><td class="r" style="color:var(--${m.importe<0?"bad":"ok"})">${$m(m.importe)}</td><td>${esc(m.medio_pago)}</td></tr>`).join("")}</tbody></table></div>`;
  $("#cg").onclick=async()=>{if(await act(()=>rpc("registrar_movimiento_caja",{p_tipo:$("#ct").value,p_importe:+$("#ci").value,p_concepto:$("#cc").value,p_fecha:$("#cf").value}),"Movimiento registrado"))draw()};
};

V.rep=async()=>{
  const t=hoy(),d=st.rd||t.slice(0,8)+"01",h=st.rh||t;
  const[r,vs,gs]=await Promise.all([rpc("resumen_periodo",{p_desde:d,p_hasta:h}),q(sb.from("ventas").select("*,venta_items(sku,descripcion,cantidad,total,costo_total)").eq("estado","cobrada").gte("fecha",d).lte("fecha",h).order("fecha")),q(sb.from("gastos").select("*,categorias_gasto(nombre,afecta_resultado)").eq("anulado",false).gte("fecha",d).lte("fecha",h))]);
  const x=r[0],dia={},sku={},cat={},mes={};
  vs.forEach(v=>{const a=dia[v.fecha]??=[0,0,0,0];a[0]++;a[1]+=+v.unidades;a[2]+=+v.total;a[3]+=+v.costo_total;const m=mes[v.fecha.slice(0,7)]??=[0,0];m[0]+=+v.total;m[1]+=+v.ganancia_bruta;
    v.venta_items.forEach(i=>{const s=sku[i.sku]??={d:i.descripcion,u:0,t:0,c:0};s.u+=+i.cantidad;s.t+=+i.total;s.c+=+i.costo_total})});
  gs.forEach(g=>{const n=g.categorias_gasto?.nombre||"-";cat[n]=(cat[n]||0)+ +g.importe});
  const D=Object.entries(dia).map(([f,a])=>[f,a[0],a[1],a[2],a[3],a[2]-a[3]]),S=Object.entries(sku).sort((a,b)=>b[1].u-a[1].u).map(([k,s])=>[k,s.d,s.u,s.t,s.c,s.t-s.c]),G=Object.entries(cat).sort((a,b)=>b[1]-a[1]);
  const tb=(id,head,rows,ty)=>`<div class="box t"><div class="row np"><div><b>${id}</b></div><div style="flex:none"><button class="b s" data-e="${id}">Exportar CSV (Excel)</button></div></div><table><thead><tr>${head.map((x,i)=>`<th class="${ty[i]=="t"?"":"r"}">${x}</th>`).join("")}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map((v,i)=>`<td class="${ty[i]=="t"?"":"r"}">${ty[i]=="m"?$m(v):ty[i]=="n"?nn(v):esc(v)}</td>`).join("")}</tr>`).join("")||'<tr><td class="m">Sin datos</td></tr>'}</tbody></table></div>`;
  const tabs={"Ventas por día":[["Fecha","Operaciones","Unidades","Facturación","Costo","Ganancia bruta"],D],"Ventas por SKU (más vendidos primero)":[["SKU","Descripción","Unidades","Facturación","Costo","Ganancia bruta"],S],"Gastos por categoría":[["Categoría","Importe"],G]};
  $("#main").innerHTML=`<h2>Reportes</h2><div class="row box np"><div><label>Desde</label><input id="rd" type="date" value="${d}"></div><div><label>Hasta</label><input id="rh" type="date" value="${h}"></div><div style="flex:none"><button class="b" id="ra">Aplicar</button> <button class="b s" id="rp">Imprimir / PDF</button></div></div>
  <p class="m">Período: ${d} al ${h} · solo ventas cobradas</p>
  <div class="g">${K("Facturación",$m(x.facturacion))}${K("Costo de mercadería",$m(x.costo_mercaderia))}${K("Gastos operativos",$m(x.gastos_operativos))}${K("Ganancia bruta",$m(x.ganancia_bruta))}${K("Ganancia neta",$m(x.ganancia_neta),x.ganancia_neta<0?"neg":"pos")}${K("Rentabilidad",nn(x.rentabilidad_pct)+" %")}${K("Unidades",nn(x.unidades))}</div>
  <h3>Evolución mensual</h3>${chart(Object.keys(mes),[{n:"Ventas",c:"#d2ad6a",v:Object.values(mes).map(a=>a[0])},{n:"Ganancia bruta",c:"#6cc48f",v:Object.values(mes).map(a=>a[1])}])}
  <h3>Ventas por día</h3>${tb("Ventas por día",tabs["Ventas por día"][0],D,"tnnmmm")}
  <h3>Ventas por SKU</h3>${tb("Ventas por SKU",tabs["Ventas por SKU (más vendidos primero)"][0],S,"ttnmmm")}
  <h3>Gastos</h3>${tb("Gastos por categoría",["Categoría","Importe"],G,"tm")}`;
  $("#ra").onclick=()=>{st.rd=$("#rd").value;st.rh=$("#rh").value;draw()};$("#rp").onclick=()=>print();
  const data={"Ventas por día":[tabs["Ventas por día"][0],D],"Ventas por SKU":[tabs["Ventas por SKU (más vendidos primero)"][0],S],"Gastos por categoría":[["Categoría","Importe"],G]};
  $$("[data-e]").forEach(b=>b.onclick=()=>csv(b.dataset.e.replace(/\s+/g,"_")+"_"+d+"_"+h,...data[b.dataset.e]));
};
boot();
</script></body></html>
